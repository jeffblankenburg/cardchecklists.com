<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>cardchecklists.com</title>
  <link href="https://fonts.googleapis.com/css2?family=Cal+Sans&display=swap" rel="stylesheet">
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; color: #333; display: flex; flex-direction: column; min-height: 100vh; }
    header { text-align: center; padding: 20px; background-color: #f8f8f8; }
    header h1 { margin: 0; font-size: 2rem; }
    header p { margin: 8px 0 0; font-size: 1rem; color: #666; }
    .grid { flex: 1; padding: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
    .grid-item { text-align: center; background: #fff; border-radius: 10px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); transition: transform 0.2s, box-shadow 0.2s; }
    .grid-item:hover { transform: translateY(-5px); box-shadow: 0 6px 10px rgba(0, 0, 0, 0.15); }
    .grid-item img { max-width: 100%; height: 221; display: block; margin: 0 auto; border-radius: 10px 10px 0 0; }
    .grid-item p { margin: 12px 0; font-size: 1rem; color: #555; font-family: 'Cal Sans', cursive; }
    .grid-item a { text-decoration: none; color: #000000; }
    .grid-item a:hover { text-decoration: underline; }
    footer { 
      position: fixed; 
      bottom: 0; 
      left: 0; 
      width: 100%; 
      text-align: center; 
      padding: 15px 20px; 
      background-color: #f1f1f1; 
      font-size: 0.8rem; 
      color: #777; 
      box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1); 
    }
    footer a { color: #555; text-decoration: none; margin: 0 10px; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
    <header>
        <h1>cardchecklists.com</h1>
        <p>Your go-to resource for collectible card checklists.</p>
    </header>
    <div class='grid'>
        <div class='grid-item'>
            <a href="https://docs.google.com/spreadsheets/d/1jmtz6bkIuCdmuEjMq5ma8UjQYQ4Zqdi_Oc0bLhgq2cA/edit?usp=sharing"><img src='images/2024ToppsChromeLogofractorEdition.png' alt='2024 Topps Chrome Logofractor Edition Checklist Spreadsheet'></a>
            <p><a href="https://docs.google.com/spreadsheets/d/1jmtz6bkIuCdmuEjMq5ma8UjQYQ4Zqdi_Oc0bLhgq2cA/edit?usp=sharing">2024 Topps Chrome Logofractor Edition</a></p>
        </div>
        <div class='grid-item'>
            <a href="https://docs.google.com/spreadsheets/d/1jmtz6bkIuCdmuEjMq5ma8UjQYQ4Zqdi_Oc0bLhgq2cA/edit?usp=sharing"><img src='images/2024ToppsFinest.png' alt='2024 Topps Finest Checklist Spreadsheet'></a>
            <p><a href="https://docs.google.com/spreadsheets/d/1jmtz6bkIuCdmuEjMq5ma8UjQYQ4Zqdi_Oc0bLhgq2cA/edit?usp=sharing">2024 Topps Finest</a></p>
        </div>
        <div class='grid-item'>
            <a href="https://docs.google.com/spreadsheets/d/1jmtz6bkIuCdmuEjMq5ma8UjQYQ4Zqdi_Oc0bLhgq2cA/edit?usp=sharing"><img src='images/2024ToppsHoliday.png' alt='2024 Topps Holiday'></a>
            <p><a href="https://docs.google.com/spreadsheets/d/1jmtz6bkIuCdmuEjMq5ma8UjQYQ4Zqdi_Oc0bLhgq2cA/edit?usp=sharing">2024 Topps Holiday</a></p>
        </div>
    <!-- Repeat grid-item blocks for each image -->
    </div>
    <footer>
        <p>© 2025 cardchecklists.com | <a href="#">Privacy</a> | <a href="#">Contact</a></p>
    </footer>
</body>
</html>
